[package]
name = "marnote"
version = "0.1.0"
description = "A local-first Markdown workspace"
authors = ["Marnote"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2.8.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
