[models.strong]
provider = "codex"
model = "gpt-6-luna"
command = "codex"
timeout_seconds = 3600
extra_args = ["-c", "model_reasoning_effort=\"medium\""]

[models.worker]
provider = "opencode"
model = "nvidia/nvidia/nemotron-3-ultra-550b-a55b"
command = "opencode"
timeout_seconds = 1800
idle_timeout_seconds = 360

[workflow]
implement_fix_attempts = 5
spec_paths = ["specs", "AGENTS.md", "RULES.md"]
memory_path = "memory"
checks = []
