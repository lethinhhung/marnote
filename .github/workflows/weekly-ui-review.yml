name: Weekly UI review

on:
  schedule:
    - cron: "59 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: Explore, improve, and review UI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev wget

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the app for browser exploration
        run: |
          pnpm --filter @marnote/desktop dev --host 127.0.0.1 > "$RUNNER_TEMP/marnote-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/marnote-vite.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/marnote-vite.log"
          exit 1

      - name: Install OpenCode
        run: npm install --global opencode-ai

      - name: Configure browser tool
        run: |
          mkdir -p artifacts/ui-review
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "mcp": {
              "playwright": {
                "type": "local",
                "command": [
                  "pnpm", "exec", "playwright-mcp", "--headless", "--isolated", "--caps", "vision",
                  "--init-script", "apps/desktop/scripts/ui-review-bridge.js",
                  "--output-dir", "artifacts/ui-review"
                ],
                "enabled": true,
                "timeout": 120000
              }
            }
          }
          EOF

      - name: Explore, review, and fix one UI issue
        id: agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY is not configured" >&2
            exit 1
          fi
          prompt=$(cat .github/prompts/weekly-ui-review.md)
          timeout 35m opencode run --auto \
            --model nvidia/nvidia/nemotron-3.5-super-vl-120b-a12b "$prompt"
          test -s artifacts/ui-review/review.md || {
            echo "OpenCode did not produce the required UI review" >&2
            exit 1
          }
          node -e 'require("node:fs").rmSync("opencode.json")'
          unexpected=$(git status --porcelain -- . \
            ':(exclude)apps/desktop/src/**' ':(exclude)artifacts/ui-review/**')
          if [ -n "$unexpected" ]; then
            echo "Agent changed files outside the permitted UI scope:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          files=$(git status --porcelain -- apps/desktop/src | sed 's/^...//' | sort -u)
          count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" -gt 3 ]; then
            echo "Agent changed $count app files; the limit is three" >&2
            exit 1
          fi
          if [ "$count" -gt 0 ]; then
            test -s artifacts/ui-review/pr-body.md || {
              echo "Agent changed code but did not produce the PR description" >&2
              exit 1
            }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat artifacts/ui-review/review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run repository validation
        if: steps.agent.outputs.changed == 'true'
        run: pnpm check

      - name: Set review date
        id: date
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Create improvement pull request
        if: steps.agent.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: develop
          branch: agent/ui-review-${{ steps.date.outputs.value }}
          title: "ui: weekly UI improvement (${{ steps.date.outputs.value }})"
          body-path: artifacts/ui-review/pr-body.md
          commit-message: "ui: weekly UI improvement"
          add-paths: apps/desktop/src/**

      - name: Upload review and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ui-review-${{ github.run_number }}
          path: artifacts/ui-review/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop app server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/marnote-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/marnote-vite.pid")" 2>/dev/null || true
          fi
