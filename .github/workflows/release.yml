name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag whose macOS assets should be rebuilt
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag, versions, and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Published macOS repairs must be dispatched from main."
            exit 1
          fi
          release_tag="$RELEASE_TAG"
          git fetch --no-tags origin "refs/tags/${release_tag}:refs/tags/release-validation"
          test "$(git cat-file -t refs/tags/release-validation)" = tag
          node scripts/check-release-version.mjs "$release_tag"
          node scripts/release-notes.mjs "$release_tag"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev wget
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  build:
    name: Build (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-latest"]') || fromJSON('["macos-latest","ubuntu-22.04","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: notes
        name: Prepare version notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-notes.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev wget
      - run: pnpm install --frozen-lockfile
      - name: Confirm macOS repair target is a published release
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          published_tag=$(gh release view "$RELEASE_TAG" --json tagName,isDraft --jq 'select(.isDraft == false).tagName')
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::${RELEASE_TAG} is not an existing published release."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Marnote ${{ inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: ${{ github.event_name == 'push' }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
      - name: Verify ad hoc macOS signature
        if: runner.os == 'macOS'
        run: |
          dmg=$(find apps/desktop/src-tauri/target/release/bundle/dmg -name 'Marnote_*.dmg' -print -quit)
          test -n "$dmg"
          mountpoint=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mountpoint" -nobrowse -readonly
          trap 'hdiutil detach "$mountpoint" -quiet || true; rmdir "$mountpoint"' EXIT
          app=$(find "$mountpoint" -maxdepth 3 -name 'Marnote.app' -type d -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --method PATCH --field draft=false --field prerelease="$PRERELEASE"
